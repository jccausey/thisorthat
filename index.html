<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>This or That Live</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase App & Realtime Database SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <!-- QRCode.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <!-- 1. Role Selection Screen -->
    <div id="setup-screen" class="max-w-md w-full bg-slate-800 p-6 rounded-2xl shadow-xl text-center">
        <h1 class="text-3xl font-extrabold text-indigo-400 mb-6">This or That Live</h1>
        <p class="text-slate-300 mb-6">Choose how you want to join this session:</p>
        <div class="space-y-4">
            <button onclick="initModerator()" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold transition">
                Host / Moderator View
            </button>
            <button onclick="showNameScreen()" class="w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-bold transition">
                Voter / Audience View
            </button>
        </div>
    </div>

    <!-- 2. Name Entry Screen (Voters Only) -->
    <div id="name-screen" class="max-w-md w-full bg-slate-800 p-6 rounded-2xl shadow-xl hidden text-center">
        <h2 class="text-2xl font-bold mb-4 text-emerald-400">Enter Your Name</h2>
        <p class="text-slate-300 text-sm mb-6">Your name will be visible next to your choice when results are revealed!</p>
        <form onsubmit="submitName(event)" class="space-y-4">
            <input id="user-name-input" type="text" placeholder="e.g., Alex" required maxlength="20"
                class="w-full px-4 py-3 rounded-xl bg-slate-700 text-white border border-slate-600 focus:outline-none focus:border-emerald-500 text-center text-lg font-semibold" />
            <button type="submit" class="w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-bold transition">
                Join Game
            </button>
        </form>
    </div>

    <!-- 3. Active Game Screen -->
    <div id="game-screen" class="max-w-xl w-full bg-slate-800 p-6 rounded-2xl shadow-xl hidden text-center">
        <!-- Header / Role Badge -->
        <div class="flex justify-between items-center mb-6">
            <span id="role-badge" class="px-3 py-1 rounded-full text-xs font-bold bg-slate-700 text-slate-300"></span>
            <span id="question-tracker" class="text-slate-400 text-sm font-semibold"></span>
        </div>

        <!-- Question Title -->
        <h2 id="question-text" class="text-2xl font-bold mb-6">Loading question...</h2>

        <!-- Voting Options / Results Display -->
        <div id="options-container" class="space-y-4 mb-6">
            <!-- Dynamic Buttons / Results Render Here -->
        </div>

        <!-- Moderator Controls (Only visible to Moderator) -->
        <div id="mod-controls" class="hidden border-t border-slate-700 pt-6 mt-6 space-y-4">
            <div class="flex justify-between gap-4">
                <button id="prev-btn" onclick="changeQuestion(-1)" class="flex-1 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg font-semibold">Previous</button>
                <button id="reveal-btn" onclick="toggleReveal()" class="flex-1 py-2 bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold rounded-lg">Reveal Results</button>
                <button id="next-btn" onclick="changeQuestion(1)" class="flex-1 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg font-semibold">Next</button>
            </div>
            
            <!-- Reset Button -->
            <button onclick="resetGame()" class="w-full py-2 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-lg transition text-sm mb-4">
                Reset Game (Clear All Votes)
            </button>
            
            <!-- Manage Questions Button -->
            <button onclick="showAdminScreen()" class="w-full py-2 bg-slate-600 hover:bg-slate-500 text-white font-bold rounded-lg transition text-sm">
                Manage Questions
            </button>

            <!-- QR Code Section for Audience Join -->
            <div class="pt-4 border-t border-slate-700/60 flex flex-col items-center">
                <p class="text-xs text-slate-400 font-semibold mb-2">Scan to Join as Participant:</p>
                <div id="qrcode" class="p-2 bg-white rounded-xl shadow-md"></div>
                <p id="app-url-display" class="text-xs text-slate-500 mt-2 break-all"></p>
            </div>
        </div>
    </div>

    <!-- 4. Admin Management Screen -->
    <div id="admin-screen" class="max-w-xl w-full bg-slate-800 p-6 rounded-2xl shadow-xl hidden text-center">
        <h2 class="text-2xl font-bold mb-6 text-indigo-400">Manage Questions</h2>
        <div id="admin-questions-list" class="space-y-4 mb-6 text-left">
            <!-- Questions rendered here -->
        </div>
        <div class="border-t border-slate-700 pt-4">
            <input id="new-q-a" type="text" placeholder="Option A" class="w-full mb-2 px-3 py-2 bg-slate-700 rounded-lg">
            <input id="new-q-b" type="text" placeholder="Option B" class="w-full mb-4 px-3 py-2 bg-slate-700 rounded-lg">
            <button onclick="addQuestion()" class="w-full py-2 bg-emerald-600 hover:bg-emerald-500 font-bold rounded-lg">Add Question</button>
            <button onclick="hideAdminScreen()" class="w-full mt-4 py-2 bg-slate-700 hover:bg-slate-600 font-bold rounded-lg">Back to Game</button>
        </div>
    </div>

    <!-- Separate config file import -->
    <script src="config.js"></script>

    <script>
        // -------------------------------------------------------------------
        // 1. APPLICATION STATE & INITIALIZATION
        // -------------------------------------------------------------------
        var isModerator = false;
        var userId = 'user_' + Math.random().toString(36).substr(2, 9);
        var userName = '';
        var activeQuestionIndex = 0;
        var isRevealed = false;
        var currentVotes = {};
        var QUESTIONS = []; // Changed to empty array initially

        // Initialize Firebase using the external config.js file
        if (typeof firebaseConfig !== 'undefined') {
            firebase.initializeApp(firebaseConfig);
        } else {
            console.warn("firebaseConfig is missing. Ensure config.js exists.");
        }
        const db = firebase.database();

        // Listen for question updates
        db.ref('questions').on('value', (snapshot) => {
            QUESTIONS = snapshot.val() || [];
            renderUI(); // Re-render when questions change
        });

        // -------------------------------------------------------------------
        // 3. SETUP FLOWS
        // -------------------------------------------------------------------
        function initModerator() {
            isModerator = true;
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('role-badge').innerText = "Moderator View";
            document.getElementById('mod-controls').classList.remove('hidden');

            // Generate QR Code dynamically using current page URL
            generateQRCode();

            listenToGameState();
        }

        function showNameScreen() {
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('name-screen').classList.remove('hidden');
        }

        function submitName(event) {
            event.preventDefault();
            const input = document.getElementById('user-name-input');
            userName = input.value.trim() || 'Anonymous';
            
            document.getElementById('name-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('role-badge').innerText = `Voter: ${userName}`;

            listenToGameState();
        }

        // -------------------------------------------------------------------
        // 4. QR CODE GENERATOR
        // -------------------------------------------------------------------
        function generateQRCode() {
            const qrContainer = document.getElementById("qrcode");
            qrContainer.innerHTML = ""; // Clear existing

            // Get current URL
            const currentUrl = window.location.href;
            document.getElementById("app-url-display").innerText = currentUrl;

            // Render QR Code
            new QRCode(qrContainer, {
                text: currentUrl,
                width: 128,
                height: 128,
                colorDark: "#0f172a",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        // -------------------------------------------------------------------
        // 5. REALTIME LISTENERS
        // -------------------------------------------------------------------
        function listenToGameState() {
            db.ref('gameState').on('value', (snapshot) => {
                const data = snapshot.val() || { currentIndex: 0, revealed: false };
                activeQuestionIndex = data.currentIndex;
                isRevealed = data.revealed;

                if (isModerator) {
                    document.getElementById('reveal-btn').innerText = isRevealed ? "Hide Results" : "Reveal Results";
                }

                listenToVotes(activeQuestionIndex);
            });
        }

        function listenToVotes(qIndex) {
            db.ref(`votes/q_${qIndex}`).on('value', (snapshot) => {
                currentVotes = snapshot.val() || {};
                renderUI();
            });
        }

        // -------------------------------------------------------------------
        // 6. UI RENDER LOGIC
        // -------------------------------------------------------------------
        function renderUI() {
            const q = QUESTIONS[activeQuestionIndex];
            document.getElementById('question-tracker').innerText = `Question ${activeQuestionIndex + 1} of ${QUESTIONS.length}`;
            document.getElementById('question-text').innerText = `${q.a} OR ${q.b}?`;

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            let namesA = [];
            let namesB = [];
            let userVote = null;

            Object.entries(currentVotes).forEach(([uid, voteObj]) => {
                const choice = voteObj.choice;
                const name = voteObj.name || 'Anonymous';

                if (choice === 'A') namesA.push(name);
                if (choice === 'B') namesB.push(name);
                if (uid === userId) userVote = choice;
            });

            const countA = namesA.length;
            const countB = namesB.length;
            const total = countA + countB;
            const pctA = total === 0 ? 0 : Math.round((countA / total) * 100);
            const pctB = total === 0 ? 0 : Math.round((countB / total) * 100);

            if (!isRevealed) {
                // VOTING MODE
                container.innerHTML = `
                    <button onclick="castVote('A')" class="w-full py-4 px-6 rounded-xl font-bold text-lg border-2 transition ${
                        userVote === 'A' ? 'bg-indigo-600 border-indigo-400 text-white' : 'bg-slate-700 border-transparent text-slate-200 hover:bg-slate-650'
                    }">
                        ${q.a} ${userVote === 'A' ? '✓' : ''}
                    </button>
                    <button onclick="castVote('B')" class="w-full py-4 px-6 rounded-xl font-bold text-lg border-2 transition ${
                        userVote === 'B' ? 'bg-emerald-600 border-emerald-400 text-white' : 'bg-slate-700 border-transparent text-slate-200 hover:bg-slate-650'
                    }">
                        ${q.b} ${userVote === 'B' ? '✓' : ''}
                    </button>
                    <p class="text-xs text-slate-400 mt-2">${total} vote(s) cast so far</p>
                `;
            } else {
                // REVEALED MODE
                const renderNames = (names, bgClass) => {
                    if (names.length === 0) return '<p class="text-xs text-slate-400 italic">No votes yet</p>';
                    return names.map(n => `<span class="inline-block text-xs font-semibold px-2.5 py-1 rounded-full ${bgClass} text-white">${n}</span>`).join(' ');
                };

                container.innerHTML = `
                    <div class="space-y-4">
                        <div class="bg-slate-700 rounded-xl p-4 text-left">
                            <div class="flex justify-between mb-1 font-semibold">
                                <span>${q.a}</span>
                                <span>${pctA}% (${countA})</span>
                            </div>
                            <div class="w-full bg-slate-800 rounded-full h-3 overflow-hidden mb-3">
                                <div class="bg-indigo-500 h-3 rounded-full transition-all duration-500" style="width: ${pctA}%"></div>
                            </div>
                            <div class="flex flex-wrap gap-1.5 pt-1 border-t border-slate-650">
                                ${renderNames(namesA, 'bg-indigo-600')}
                            </div>
                        </div>

                        <div class="bg-slate-700 rounded-xl p-4 text-left">
                            <div class="flex justify-between mb-1 font-semibold">
                                <span>${q.b}</span>
                                <span>${pctB}% (${countB})</span>
                            </div>
                            <div class="w-full bg-slate-800 rounded-full h-3 overflow-hidden mb-3">
                                <div class="bg-emerald-500 h-3 rounded-full transition-all duration-500" style="width: ${pctB}%"></div>
                            </div>
                            <div class="flex flex-wrap gap-1.5 pt-1 border-t border-slate-650">
                                ${renderNames(namesB, 'bg-emerald-600')}
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        // -------------------------------------------------------------------
        // 7. USER ACTIONS
        // -------------------------------------------------------------------
        function castVote(option) {
            if (isRevealed) return;
            db.ref(`votes/q_${activeQuestionIndex}/${userId}`).set({
                choice: option,
                name: userName
            });
        }

        function changeQuestion(delta) {
            const nextIdx = activeQuestionIndex + delta;
            if (nextIdx >= 0 && nextIdx < QUESTIONS.length) {
                db.ref('gameState').set({
                    currentIndex: nextIdx,
                    revealed: false
                });
            }
        }

        function toggleReveal() {
            db.ref('gameState/revealed').set(!isRevealed);
        }

        function resetGame() {
            if (!confirm("Are you sure you want to reset the entire game? This will clear all votes and jump back to Question 1.")) return;

            db.ref('gameState').set({
                currentIndex: 0,
                revealed: false
            });

            db.ref('votes').remove();
        }
        // -------------------------------------------------------------------
        // 8. ADMIN FUNCTIONS
        // -------------------------------------------------------------------
        function showAdminScreen() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('admin-screen').classList.remove('hidden');
            renderAdminUI();
        }

        function hideAdminScreen() {
            document.getElementById('admin-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
        }

        function addQuestion() {
            const a = document.getElementById('new-q-a').value.trim();
            const b = document.getElementById('new-q-b').value.trim();
            if (!a || !b) return;

            QUESTIONS.push({ a, b });
            db.ref('questions').set(QUESTIONS);

            document.getElementById('new-q-a').value = '';
            document.getElementById('new-q-b').value = '';
            renderAdminUI();
        }

        function deleteQuestion(index) {
            QUESTIONS.splice(index, 1);
            db.ref('questions').set(QUESTIONS);
            renderAdminUI();
        }

        function renderAdminUI() {
            const list = document.getElementById('admin-questions-list');
            list.innerHTML = '';
            QUESTIONS.forEach((q, i) => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-slate-700 p-3 rounded-lg";
                div.innerHTML = `
                    <span>${q.a} / ${q.b}</span>
                    <button onclick="deleteQuestion(${i})" class="text-rose-400 hover:text-rose-300">Delete</button>
                `;
                list.appendChild(div);
            });
        }
    </script>
</body>
</html>
